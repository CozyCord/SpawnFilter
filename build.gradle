plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Night Config for TOML parsing (included as Jar-in-Jar)
	include(implementation("com.electronwill.night-config:core:3.8.1"))
	include(implementation("com.electronwill.night-config:toml:3.8.1"))
}

processResources {
	inputs.property "id", project.mod_id
	inputs.property "name", project.mod_name
	inputs.property "version", project.version
	inputs.property "group", project.maven_group
	inputs.property "description", project.mod_description
	inputs.property "minecraftVersion", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand(
			"id": project.mod_id,
			"name": project.mod_name,
			"version": project.version,
			"group": project.maven_group,
			"description": project.mod_description,
			"minecraftVersion": project.minecraft_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
